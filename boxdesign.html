<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOX DESIGN</title>
  <style>
    *{

    }
    .box1{
      height: 200px;
      width: 200px;
      background-color: red;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box2{
      height: 200px;
      width: 200px;
      background-color: blue;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-left: 200px;
      color: white;
    }
    .box3{
      height: 200px;
      width: 200px;
      background-color: green;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-left: 400px;
      color: white;
    }

  </style>
</head>
<body>
  <div class="box1">
    OH
  </div>
  <div class="box2">
    MY
  </div>
  <div class="box3">
    GOD
  </div>
</body>
</html>
