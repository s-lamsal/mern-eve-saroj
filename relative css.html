<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web -Css</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        /* padding: 10px; */
      }

      .box1 {
        height: 600px;
        width: 600px;
        background-color: red;
        position: relative;
      }
      .cbox1{
        height: 200px;
        width: 200px;
        background-color: blue;

      }
      .cbox2{
        height: 200px;
        width: 200px;
        background-color: green;
        position: absolute;
        left: 200px;

      }
      .cbox3{
        height: 200px;
        width: 200px;
        background-color: black;
        position: absolute;
        left: 400px;
        top: 400px;

      }
    
    </style>

  </head>

  <body>


    <div class="box1">
      <div class="cbox1"></div>
      <div class="cbox2"></div>
      <div class="cbox3"></div>
    </div>
   
    

  </body>

</html>
