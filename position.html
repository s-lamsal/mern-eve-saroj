<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web -Css</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        /* padding: 10px; */
      }

      .box1 {
        height: 200px;
        width: 200px;
        background-color: red;
        position: absolute;
        top: 0;
      }
      .box2 {
        height: 200px;
        width: 200px;
        background-color: blue;
        position: absolute;
        top: 200px;
        left: 200px;
      }
      .box3 {
        height: 200px;
        width: 200px;
        background-color: green;
        position: absolute;
        top: 400px;
        left: 400px;
      }
    </style>

  </head>

  <body>


    <div class="box1">
    </div>
    <div class="box2">
    </div>
    <div class="box3">
    </div>
    

  </body>

</html>
